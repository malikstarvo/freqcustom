# Prometheus configuration for scraping Freqtrade metrics
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "freqtrade"
    static_configs:
      - targets: ["freqtrade:8080"]
    metrics_path: "/api/v1/ping"
    scheme: http

  - job_name: "freqtrade-metrics"
    static_configs:
      - targets: ["freqtrade:8080"]
    metrics_path: "/metrics"
    scheme: http
